  <meta charset="UTF-8" />
  <meta name="viewport"

  <meta name="theme-color" content="#ffffff" />
  <title>한글 마스터</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Gowun Dodum', sans-serif;
      overflow: hidden;
      /* Prevent scrolling for game feel */
      touch-action: none;
      /* Prevent browser zooming/scrolling on mobile */
    }

    h1,
    h2,
    h3,
    .game-font {
      font-family: 'Jua', sans-serif;
    }

    @keyframes float {
      0% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-20px);
      }

      100% {
        transform: translateY(0px);
      }
    }

    .animate-float {
      animation: float 3s ease-in-out infinite;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0.8;
      animation: twinkle 2s infinite ease-in-out alternate;
    }

    @keyframes twinkle {
      0% {
        opacity: 0.3;
        transform: scale(0.8);
      }

      100% {
        opacity: 1;
        transform: scale(1.2);
      }
    }

    @media print {

      body,
      html {
        overflow: visible !important;
        height: auto !important;
      }

      /* Ensure the print container is the only thing visible and flows naturally */
      #root {
        display: none;
        /* Hide the app root by default if we want to print from outside, OR strict visibility control */
      }

      /* NOTE: We are using Tailwind 'print:hidden' classes in React to hide specific elements, 
         so we might not need to hide #root if the React component handles it well. 
         However, resetting body overflow is CRITICAL. */
    }
  </style>
